[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlearn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.0",
  "yt-dlp>=2024.0",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
media = ["numpy>=1.26", "Pillow>=10.0"]

[project.scripts]
vlearn = "app.cli:main"
vlearn-mcp = "app.mcp.server:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["video*", "config*", "tests*", "out*", "cache*", "in*", "*.egg-info*", "*.venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # line-length 由 formatter 控制
  "B008",   # FastMCP 裝飾器調用不算 mutable default
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
